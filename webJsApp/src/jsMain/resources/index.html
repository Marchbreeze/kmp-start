<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty - KMP Web (JS)</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --bg-card: #2C2C2C;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --accent: #BB86FC;
            --accent-variant: #6200EE;
            --success: #03DAC6;
            --error: #CF6679;
            --border: #3C3C3C;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* Top App Bar */
        .top-bar {
            background-color: var(--bg-secondary);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 600;
            flex: 1;
        }

        .top-bar .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .top-bar button {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            font-size: 20px;
        }

        .top-bar button:hover { background-color: var(--bg-card); }

        /* Character Grid */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Character Card */
        .character-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid var(--border);
        }

        .character-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .character-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .character-card .card-body {
            padding: 16px;
        }

        .character-card .card-body h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .character-card .card-body .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.alive { background-color: #4CAF50; }
        .status-dot.dead { background-color: #F44336; }
        .status-dot.unknown { background-color: #9E9E9E; }

        /* Detail Page */
        .detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .detail-hero img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
        }

        .detail-hero h2 {
            font-size: 28px;
            margin: 16px 0 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .info-card {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-card .label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-card .value {
            font-size: 16px;
            font-weight: 500;
        }

        /* Settings Page */
        .settings-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .settings-section {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .settings-section h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--accent);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .setting-row:last-child { border-bottom: none; }

        .setting-row .setting-label {
            font-size: 14px;
        }

        .setting-row .setting-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 48px;
            height: 26px;
        }

        .toggle input { opacity: 0; width: 0; height: 0; }

        .toggle .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555;
            border-radius: 26px;
            transition: 0.3s;
        }

        .toggle .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .slider { background-color: var(--accent); }
        .toggle input:checked + .slider:before { transform: translateX(22px); }

        /* Range Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: #555;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Loading & Error */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            font-size: 18px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            text-align: center;
            padding: 40px;
            color: var(--error);
        }

        .error-message button {
            margin-top: 12px;
            padding: 8px 24px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Back button */
        .back-btn {
            font-size: 24px !important;
            padding: 4px 8px !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="webJsApp.js"></script>
</body>
</html>
